<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Afghanistan Tourism</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #F3ECDC;
            color: #0B1F3B;
        }

        /* ---------- NAVBAR ---------- */
        nav {
            position: absolute;
            top: 20px;
            right: 40px;
        }

        nav a {
            color: #FFFFFF;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        nav a:hover {
            color: #6FD1C7;
        }

        /* ---------- HERO ---------- */
        .hero {
            height: 55vh;
            background: linear-gradient(
                rgba(11, 31, 59, 0.55),
                rgba(11, 31, 59, 0.55)
            ),
            url("images/afghanistan-hero.jpg") center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #FFFFFF;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto 25px;
            color: #F3ECDC;
        }

        .hero a {
            background-color: #1F6AE1;
            color: #FFFFFF;
            padding: 12px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        .hero a:hover {
            background-color: #0B1F3B;
        }

        /* ---------- SECTION ---------- */
        section {
            padding: 70px 40px;
            text-align: center;
            background-color: #FFFFFF;
        }

        section h2 {
            font-size: 28px;
            color: #1F6AE1;
            margin-bottom: 10px;
        }

        section p {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 40px;
        }

        /* ---------- GRID ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background-color: #FFFFFF;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 18px;
            text-align: left;
        }

        .card-content h3 {
            font-size: 18px;
            color: #1F6AE1;
            margin-bottom: 8px;
        }

        .card-content p {
            font-size: 13px;
            color: #6B7280;
            margin-bottom: 15px;
        }

        .card-content a {
            display: inline-block;
            background-color: #2FA36B;
            color: #FFFFFF;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 13px;
            text-decoration: none;
        }

        .card-content a:hover {
            background-color: #FF6B5A;
        }

        /* ---------- CTA ---------- */
        .cta {
            background: linear-gradient(
                rgba(31, 106, 225, 0.9),
                rgba(31, 106, 225, 0.9)
            ),
            url("images/footer-bg.jpg") center/cover no-repeat;
            padding: 80px 20px;
            text-align: center;
            color: #FFFFFF;
        }

        .cta h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .cta p {
            font-size: 14px;
            margin-bottom: 25px;
            color: #F3ECDC;
        }

        .cta a {
            background-color: #FF6B5A;
            color: #FFFFFF;
            padding: 12px 34px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        .cta a:hover {
            background-color: #2FA36B;
        }
    </style>
</head>
<body>
    <h1>This is the h1</h1>
    <h2>this is h2</h2>
    <h3>this is h3</h3>
    <p style="color: #ff9999; font-size: 20px;">Hello This is our first time trying to deploy out website.</p>

</html>
